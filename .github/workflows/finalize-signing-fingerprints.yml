name: Finalize production signing fingerprints

on:
  push:
    branches: [agent/update-progress-test]
    paths:
      - .github/workflows/finalize-signing-fingerprints.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/update-progress-test
          fetch-depth: 0
      - run: python3 .github/scripts/finalize_signing_fingerprints.py
      - name: Commit final signing configuration
        shell: bash
        run: |
          rm -f .github/scripts/finalize_signing_fingerprints.py
          rm -f .github/workflows/finalize-signing-fingerprints.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Pin Olympus View production signing certificates"
          git push origin HEAD:agent/update-progress-test
