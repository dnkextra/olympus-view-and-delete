name: Create v1.3.7 tag

on:
  push:
    branches:
      - master
    paths:
      - '.github/workflows/create-v1.3.7-tag.yml'

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Create release tag
        shell: bash
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --tags origin refs/tags/v1.3.7 >/dev/null 2>&1; then
            echo 'v1.3.7 already exists'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a v1.3.7 42e153f2f7deb2d66e495e3dd4c79d3690d2ec65 -m 'Olympus View v1.3.7'
          git push origin refs/tags/v1.3.7
