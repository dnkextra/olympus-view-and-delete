name: Apply downloaded-files selection action

on:
  push:
    branches: [agent/update-progress-test]
    paths:
      - .github/workflows/apply-select-downloaded.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout test branch
        uses: actions/checkout@v6
        with:
          ref: agent/update-progress-test
          fetch-depth: 0

      - name: Add select-downloaded action
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('lib/screens/home_screen.dart')
          text = path.read_text()

          old_method = """  void _deselectAll() {\n    setState(() => _selectedPaths.clear());\n  }\n\n  void _selectByDates() {\n"""
          new_method = """  void _deselectAll() {\n    setState(() => _selectedPaths.clear());\n  }\n\n  void _selectDownloaded() {\n    final downloadedPaths = _filteredFiles\n        .where((file) => _downloadedKeys.contains(file.downloadHistoryKey))\n        .map((file) => file.fullPath)\n        .toSet();\n\n    setState(() {\n      _selectedPaths\n        ..clear()\n        ..addAll(downloadedPaths);\n    });\n\n    if (downloadedPaths.isEmpty) {\n      _showSnack(_localizedText(\n        en: 'No downloaded files in the current view.',\n        ru: 'В текущем списке нет скачанных файлов.',\n        uk: 'У поточному списку немає завантажених файлів.',\n      ));\n    }\n  }\n\n  void _selectByDates() {\n"""
          if old_method not in text:
              raise SystemExit('select method insertion point not found')
          text = text.replace(old_method, new_method, 1)

          old_action = """            IconButton(\n              icon: const Icon(Icons.deselect),\n              tooltip: 'Deselect all',\n              onPressed: _deselectAll,\n            ),\n            IconButton(\n              icon: const Icon(Icons.date_range),\n"""
          new_action = """            IconButton(\n              icon: const Icon(Icons.deselect),\n              tooltip: 'Deselect all',\n              onPressed: _deselectAll,\n            ),\n            IconButton(\n              icon: const Icon(Icons.download_done, color: Color(0xFF2ECC71)),\n              tooltip: _localizedText(\n                en: 'Select downloaded',\n                ru: 'Выделить скачанные',\n                uk: 'Виділити завантажені',\n              ),\n              onPressed: _selectDownloaded,\n            ),\n            IconButton(\n              icon: const Icon(Icons.date_range),\n"""
          if old_action not in text:
              raise SystemExit('selection toolbar insertion point not found')
          text = text.replace(old_action, new_action, 1)

          path.write_text(text)
          PY

      - name: Remove one-time workflow and commit
        shell: bash
        run: |
          rm -f .github/workflows/apply-select-downloaded.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add select downloaded files action"
          git push origin HEAD:agent/update-progress-test
