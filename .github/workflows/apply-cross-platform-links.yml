name: Apply cross-platform download migration

on:
  push:
    branches: [agent/windows-web-release]
    paths:
      - .github/workflows/apply-cross-platform-links.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/windows-web-release
          fetch-depth: 0
      - name: Patch download links and remove tracked generated releases
        run: |
          set -euo pipefail
          python3 scripts/patch_cross_platform_downloads.py
          git rm -r releases
      - name: Commit migration
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .gitignore README.md docs/index.html docs/index.md docs/index.ru.md docs/index.uk.md docs/llms.txt
          git diff --cached --stat
          git commit -m "Move desktop and web downloads to GitHub Releases"
          git push origin HEAD:agent/windows-web-release
