name: Apply Windows runner compatibility fix

on:
  push:
    branches: [agent/windows-web-release]
    paths:
      - .github/workflows/apply-cross-platform-links.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/windows-web-release
          fetch-depth: 0
      - name: Pin Windows build jobs to VS2022
        run: python3 scripts/patch_cross_platform_downloads.py
      - name: Commit runner fix
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/flutter-ci.yml .github/workflows/release.yml
          git diff --cached --stat
          git commit -m "Pin Windows builds to VS2022"
          git push origin HEAD:agent/windows-web-release
