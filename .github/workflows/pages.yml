name: Deploy GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

env:
  FLUTTER_VERSION: "3.44.7"
  APP_BASE_HREF: "/olympus-view-and-delete/app/"

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    name: Build site and Web app
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Enable Web
        run: flutter config --enable-web

      - name: Install dependencies
        run: flutter pub get

      - name: Verify lock file is synchronized
        run: git diff --exit-code -- pubspec.lock

      - name: Prepare build metadata
        shell: bash
        run: |
          set -euo pipefail
          echo "BUILD_TIME_UTC=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_ENV"
          echo "BUILD_GIT_COMMIT=$(git rev-parse --short=12 HEAD)" >> "$GITHUB_ENV"

      - name: Build Flutter Web for Pages
        run: >-
          flutter build web --release
          --base-href "${APP_BASE_HREF}"
          --dart-define=OLYMPUS_BUILD_TIME_UTC=${BUILD_TIME_UTC}
          --dart-define=OLYMPUS_GIT_COMMIT=${BUILD_GIT_COMMIT}
          --dart-define=OLYMPUS_FLUTTER_VERSION=${FLUTTER_VERSION}

      - name: Assemble Pages site
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site/app
          cp -a docs/. _site/
          cp -a build/web/. _site/app/
          touch _site/.nojekyll

      - name: Verify Pages output
        shell: bash
        run: |
          set -euo pipefail
          test -s _site/index.html
          test -s _site/llms.txt
          test -s _site/app/index.html
          test -s _site/app/main.dart.js
          grep -Fq '<base href="/olympus-view-and-delete/app/">' _site/app/index.html
          test ! -d _site/docs
          echo "Landing page: _site/index.html"
          echo "Flutter Web: _site/app/index.html"

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
