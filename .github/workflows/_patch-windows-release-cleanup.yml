name: One-time Windows release cleanup patch

on:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[windows-cleanup-patched]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Apply patch
        run: python3 scripts/_patch_windows_release_cleanup.py
      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add build_release.cmd
          git diff --cached --quiet && exit 0
          git commit -m "Fix Windows release cleanup ordering [windows-cleanup-patched]"
          git push
