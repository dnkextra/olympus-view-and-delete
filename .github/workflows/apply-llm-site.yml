name: Apply LLM site metadata

on:
  push:
    branches: [agent/llms-site-audit]
    paths:
      - .github/workflows/apply-llm-site.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/llms-site-audit
          fetch-depth: 0
      - name: Patch static site metadata
        run: python3 scripts/patch_llm_site.py
      - name: Commit patched index
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/index.html
          git diff --cached --quiet && { echo "No index changes produced"; exit 1; }
          git commit -m "Improve LLM discovery and structured data"
          git push origin HEAD:agent/llms-site-audit
