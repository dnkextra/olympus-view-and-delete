name: Prepare v1.3.4 Release

on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/prepare-release-v1.3.4.yml"

permissions:
  contents: write
  actions: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Update changelog and site
        shell: python
        run: |
          from pathlib import Path
          import re

          changelog_path = Path("CHANGELOG.md")
          text = changelog_path.read_text(encoding="utf-8")

          release = r'''## [1.3.4] - 2026-08-16

### Added
- **GitHub APK auto-update**: the direct Android build checks the latest GitHub release at startup, can download a newer APK in the background and shows an install-ready notification. The Google Play flavor explicitly disables external APK updates.
- **Persistent downloaded-file markers**: successfully downloaded camera files are remembered by camera path, size and FAT timestamp and remain highlighted after app restarts and normal app updates.
- **Android background camera downloads**: selected files can continue downloading through a `connectedDevice` foreground service while Olympus View is backgrounded or the screen is off, with progress and completion notifications.
- **Runtime diagnostics**: four-finger gesture, long-press About entry and a visible Debug information fallback open a diagnostics screen with installed version/build, embedded build metadata, device/ABI, display/memory/storage, active network, camera endpoint, permissions and download state without exposing saved Wi-Fi passwords.

### Changed
- Full-screen camera traffic now prioritizes the **visible preview first**, an active file download second, and neighboring preview preloads last; gallery thumbnail network work pauses while the viewer is open.
- Neighbor previews preload in controlled **right/left pairs**: `(+1, -1)`, then `(+2, -2)`, then `(+3, -3)`, with at most two parallel camera requests per pair and preloading paused during foreground/background downloads.
- About reads the installed Android package version/build at runtime instead of relying on a duplicated Dart constant.
- Android distribution is split into `github` and `play` flavors so the GitHub APK can self-update while the Play build does not request `REQUEST_INSTALL_PACKAGES`.
- Android `versionName` and `versionCode` come directly from the Flutter Gradle plugin.
- Local release builds now clean stale Flutter/Android artifacts, embed build time/Git commit/Flutter version and strictly verify packaged Dart AOT metadata; `install.cmd` force-stops the old process, verifies the installed version and starts a fresh process after replacement.
- Version set to **1.3.4+13**.

### Fixed
- Downloading while the current preview is still loading no longer leaves the preview spinner stuck; downloaded JPEG bytes can immediately satisfy the preview.
- Full-screen preview now shows the green downloaded marker for files already present in persistent download history.
- Diagnostics navigation is deferred through the root navigator and raw-pointer handling makes the multi-touch/About entry deterministic on devices that coalesce or reserve gestures.
- Release builds no longer risk packaging stale `libapp.so` from a previous build; CI/local metadata verification rejects mismatched AOT output.
- Latest Android CI passes analyzer, the full test suite, release APK/AAB builds, package-version verification, Dart AOT metadata verification, Play-flavor policy validation and 16 KB page-size compatibility.

'''

          start = text.index("## [Unreleased]")
          old_release = text.index("## [1.3.2]", start)
          tail = text[old_release:]

          misplaced_prefixes = (
              "- Full-screen camera traffic is now serialized by priority:",
              "- Downloading while the current preview is still loading no longer leaves the preview spinner stuck;",
              "- Full-screen preview now shows a green `download_done` marker",
              "- Diagnostics entry is more reliable:",
              "- Neighbor full-screen previews now preload in controlled **right/left pairs**:",
              "- Diagnostics navigation is deferred through the root navigator;",
              "- Diagnostic test build bumped to **1.3.4+13**.",
          )
          tail_lines = [
              line for line in tail.splitlines()
              if not line.startswith(misplaced_prefixes)
          ]
          tail = "\n".join(tail_lines).rstrip() + "\n"
          text = text[:start] + release + tail
          changelog_path.write_text(text, encoding="utf-8")

          index_path = Path("docs/index.html")
          html = index_path.read_text(encoding="utf-8")
          html = re.sub(r'"softwareVersion":\s*"[^"]+"', '"softwareVersion": "1.3.4"', html, count=1)
          html = re.sub(r'"dateModified":\s*"[^"]+"', '"dateModified": "2026-08-16"', html, count=1)

          blocks = {
              "changelog-en": '''        <div class="changelog-version">
            <h3>v1.3.4 — August 16, 2026</h3>
            <h4>Android downloads, diagnostics &amp; preview reliability</h4>
            <ul>
                <li><strong>Background downloads</strong> continue while the app is minimized or the screen is off, with progress and completion notifications</li>
                <li><strong>Persistent downloaded markers</strong> remain visible across restarts and normal app updates</li>
                <li><strong>GitHub APK auto-update</strong> checks and downloads new direct releases; the Google Play flavor disables external APK installation</li>
                <li><strong>Runtime diagnostics</strong> show installed build/version, build metadata, device/network/storage and camera state without exposing saved Wi-Fi passwords</li>
                <li><strong>Preview priority and paired preloading</strong> keep the visible image responsive while downloads/preloads share the camera connection safely</li>
                <li>Fixed stuck preview spinners, downloaded-preview reuse, persistent green markers and stale AOT release artifacts</li>
                <li>Release build: <strong>1.3.4+13</strong>; Android CI passes analyze/tests, APK/AAB, metadata, Play-policy and 16 KB checks</li>
            </ul>
        </div>''',
              "changelog-uk": '''        <div class="changelog-version">
            <h3>v1.3.4 — 16 серпня 2026</h3>
            <h4>Завантаження Android, діагностика та надійність прев'ю</h4>
            <ul>
                <li><strong>Фонові завантаження</strong> продовжуються після згортання застосунку або вимкнення екрана</li>
                <li><strong>Постійні позначки завантажених файлів</strong> зберігаються між запусками та оновленнями</li>
                <li><strong>Автооновлення GitHub APK</strong> перевіряє прямі релізи; Google Play-збірка не встановлює зовнішні APK</li>
                <li><strong>Діагностика під час роботи</strong> показує версію, build metadata, пристрій, мережу, сховище та стан камери без паролів Wi-Fi</li>
                <li><strong>Пріоритет прев'ю та парне передзавантаження</strong> роблять перегляд стабільнішим під час завантажень</li>
                <li>Виправлено зависання прев'ю, повторне використання завантаженого JPEG, зелені позначки та застарілі AOT-артефакти</li>
                <li>Реліз: <strong>1.3.4+13</strong>; Android CI успішно проходить аналіз, тести, APK/AAB, metadata, Play-policy та 16 КБ</li>
            </ul>
        </div>''',
              "changelog-ru": '''        <div class="changelog-version">
            <h3>v1.3.4 — 16 августа 2026</h3>
            <h4>Загрузки Android, диагностика и надёжность превью</h4>
            <ul>
                <li><strong>Фоновые загрузки</strong> продолжаются после сворачивания приложения или выключения экрана</li>
                <li><strong>Постоянные метки скачанных файлов</strong> сохраняются между запусками и обычными обновлениями</li>
                <li><strong>Автообновление GitHub APK</strong> проверяет прямые релизы; сборка Google Play не устанавливает внешние APK</li>
                <li><strong>Диагностика во время работы</strong> показывает версию, build metadata, устройство, сеть, хранилище и состояние камеры без сохранённых Wi-Fi паролей</li>
                <li><strong>Приоритет превью и парная предзагрузка</strong> делают просмотр стабильнее, пока загрузки делят соединение с камерой</li>
                <li>Исправлены зависание превью, повторное использование скачанного JPEG, зелёные метки и устаревшие AOT-артефакты релиза</li>
                <li>Релиз: <strong>1.3.4+13</strong>; Android CI успешно проходит анализ, тесты, APK/AAB, metadata, Play-policy и проверку 16 КБ</li>
            </ul>
        </div>''',
          }

          for marker, block in blocks.items():
              pattern = rf'(<h2 id="{marker}">.*?</h2>\s*<div class="changelog">\s*)<div class="changelog-version">.*?</div>'
              html, count = re.subn(pattern, lambda m: m.group(1) + block, html, count=1, flags=re.S)
              if count != 1:
                  raise RuntimeError(f"Could not update {marker}")

          index_path.write_text(html, encoding="utf-8")

      - name: Commit release documentation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/prepare-release-v1.3.4.yml
          git add CHANGELOG.md docs/index.html
          git diff --cached --check
          git commit -m "Prepare Olympus View v1.3.4 release"
          git push origin HEAD:master

      - name: Start signed v1.3.4 release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref master -f release_tag=v1.3.4
