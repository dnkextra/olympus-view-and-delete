name: Prepare v1.3.4 Release

on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/prepare-release-v1.3.4.yml"
      - "scripts/prepare_release_1_3_4.py"

permissions:
  contents: write
  actions: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Update release documentation
        run: python3 scripts/prepare_release_1_3_4.py

      - name: Commit release documentation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/prepare-release-v1.3.4.yml scripts/prepare_release_1_3_4.py
          git add CHANGELOG.md docs/index.html
          git diff --cached --check
          git commit -m "Prepare Olympus View v1.3.4 release"
          git push origin HEAD:master

      - name: Start signed v1.3.4 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref master -f release_tag=v1.3.4
