name: Prepare v1.3.5 Release

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/prepare-release-v1.3.5.yml'

permissions:
  contents: write
  actions: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Prepare v1.3.5 files
        run: python3 .github/scripts/prepare_v1_3_5.py

      - name: Commit release candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/scripts/prepare_v1_3_5.py
          git rm .github/workflows/prepare-release-v1.3.5.yml
          git add pubspec.yaml lib/version.dart CHANGELOG.md docs/index.html
          git diff --cached --check
          git commit -m 'Prepare Olympus View v1.3.5 updater test release'
          git push origin HEAD:master

      - name: Start signed v1.3.5 release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref master -f release_tag=v1.3.5
