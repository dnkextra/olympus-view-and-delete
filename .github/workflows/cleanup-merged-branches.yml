name: Cleanup stale branches

on:
  push:
    branches:
      - master
    paths:
      - '.github/workflows/cleanup-merged-branches.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete all non-master branches
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          branches="$(gh api --paginate "repos/$GITHUB_REPOSITORY/branches?per_page=100" --jq '.[].name')"
          deleted=0
          while IFS= read -r branch; do
            [[ -z "$branch" ]] && continue
            [[ "$branch" == "master" ]] && continue
            echo "DELETE: $branch"
            encoded="$(python3 -c 'import sys, urllib.parse; print(urllib.parse.quote(sys.argv[1], safe=""))' "$branch")"
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$encoded"
            deleted=$((deleted + 1))
          done <<< "$branches"
          echo "Deleted stale branches: $deleted"
