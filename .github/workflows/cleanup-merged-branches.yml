name: Cleanup merged branches

on:
  push:
    branches:
      - master
    paths:
      - '.github/workflows/cleanup-merged-branches.yml'

permissions:
  contents: write
  pull-requests: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Delete only branches fully merged into master
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --prune origin '+refs/heads/*:refs/remotes/origin/*'
          deleted=0
          skipped=0
          while IFS= read -r ref; do
            branch="${ref#origin/}"
            [[ "$branch" == "master" ]] && continue
            [[ "$branch" == "HEAD" ]] && continue

            open_prs="$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --head "$branch" --json number --jq 'length')"
            if [[ "$open_prs" != "0" ]]; then
              echo "KEEP (open PR): $branch"
              skipped=$((skipped + 1))
              continue
            fi

            if git merge-base --is-ancestor "origin/$branch" origin/master; then
              echo "DELETE (merged): $branch"
              gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$branch"
              deleted=$((deleted + 1))
            else
              echo "KEEP (contains commits not in master): $branch"
              skipped=$((skipped + 1))
            fi
          done < <(git for-each-ref --format='%(refname:short)' refs/remotes/origin | sort)

          echo "Deleted merged branches: $deleted"
          echo "Kept branches requiring review: $skipped"
