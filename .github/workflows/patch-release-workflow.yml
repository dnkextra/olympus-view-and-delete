name: Patch release workflow

on:
  push:
    branches:
      - master
    paths:
      - '.github/workflows/patch-release-workflow.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Harden release workflow
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/release.yml')
          text = path.read_text()

          replacements = [
              ('        default: "v1.3.6"\n', ''),
              ('            tag="${INPUT_TAG:-v1.3.6}"', '            tag="${INPUT_TAG:?workflow_dispatch requires release_tag}"'),
              ('            --target "$GITHUB_SHA" \\\n', ''),
          ]
          for old, new in replacements:
              if text.count(old) != 1:
                  raise SystemExit(f'Expected exactly one match for: {old!r}')
              text = text.replace(old, new)

          version_line = '          version="${tag#v}"\n'
          if text.count(version_line) != 1:
              raise SystemExit('Could not locate release version extraction')
          version_check = '''          version="${tag#v}"
          app_version="$(sed -n 's/^version: \\([^+]*\\).*/\\1/p' pubspec.yaml | head -n 1)"
          if [[ -z "$app_version" || "$version" != "$app_version" ]]; then
            echo "ERROR: release tag $tag does not match pubspec version ${app_version:-<missing>}." >&2
            exit 1
          fi
'''
          text = text.replace(version_line, version_check)

          release_guard = '''          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
'''
          if text.count(release_guard) != 1:
              raise SystemExit('Could not locate release existence guard')
          ensure_tag = '''          if ! git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Creating release tag $RELEASE_TAG at $GITHUB_SHA"
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git tag -a "$RELEASE_TAG" "$GITHUB_SHA" -m "Olympus View $RELEASE_TAG"
            git push origin "refs/tags/$RELEASE_TAG"
          fi

'''
          text = text.replace(release_guard, ensure_tag + release_guard)

          repo_line = '            --repo "$GITHUB_REPOSITORY" \\\n'
          if text.count(repo_line) != 1:
              raise SystemExit('Could not locate gh release repo option')
          text = text.replace(repo_line, repo_line + '            --verify-tag \\\n')

          path.write_text(text)
          PY

          rm .github/workflows/patch-release-workflow.yml
          git diff --check
          git diff -- .github/workflows/release.yml .github/workflows/patch-release-workflow.yml

      - name: Commit cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/release.yml .github/workflows/patch-release-workflow.yml
          git commit -m 'Harden manual release workflow'
          git push origin HEAD:master
