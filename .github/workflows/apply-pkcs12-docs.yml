name: Apply PKCS12 docs

on:
  push:
    branches: [agent/update-progress-test]
    paths:
      - .github/workflows/apply-pkcs12-docs.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/update-progress-test
          fetch-depth: 0
      - run: python3 scripts/patch_pkcs12_docs.py
      - name: Commit docs
        shell: bash
        run: |
          rm -f scripts/patch_pkcs12_docs.py
          rm -f .github/workflows/apply-pkcs12-docs.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Document PKCS12 signing stores"
          git push origin HEAD:agent/update-progress-test
