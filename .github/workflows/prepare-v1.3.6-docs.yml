name: Prepare v1.3.6 docs

on:
  push:
    branches: [agent/update-progress-test]
    paths:
      - .github/workflows/prepare-v1.3.6-docs.yml

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/update-progress-test
          fetch-depth: 0
      - run: python3 scripts/prepare_release_1_3_6.py
      - name: Commit prepared release docs
        shell: bash
        run: |
          rm -f scripts/prepare_release_1_3_6.py
          rm -f .github/workflows/prepare-v1.3.6-docs.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Prepare Olympus View v1.3.6 documentation"
          git push origin HEAD:agent/update-progress-test
