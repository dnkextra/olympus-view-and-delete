name: Publish v1.3.7

on:
  push:
    branches:
      - master
    paths:
      - '.github/workflows/publish-v1.3.7.yml'

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release source
        uses: actions/checkout@v6
        with:
          ref: v1.3.7

      - name: Download verified v1.3.7 build artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          gh run download 33116165819 --repo "$GITHUB_REPOSITORY" --name release-android --dir dist
          gh run download 33116165819 --repo "$GITHUB_REPOSITORY" --name release-windows --dir dist
          gh run download 33116165819 --repo "$GITHUB_REPOSITORY" --name release-web --dir dist
          test -s dist/OlympusView-Android.apk
          test -s dist/OlympusView-Android.aab
          test -s dist/OlympusView-Windows.zip
          test -s dist/OlympusView-Web.zip
          (cd dist && sha256sum OlympusView-Android.apk OlympusView-Android.aab OlympusView-Windows.zip OlympusView-Web.zip > SHA256SUMS.txt)

      - name: Prepare v1.3.7 release notes
        shell: bash
        run: |
          set -euo pipefail
          awk -v version='1.3.7' '
            $0 ~ "^## \\[" version "\\]" {capture=1; next}
            capture && $0 ~ "^## \\[" {exit}
            capture {print}
          ' CHANGELOG.md > release-notes.md
          test -s release-notes.md

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view v1.3.7 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'Release v1.3.7 already exists; refusing to overwrite it.'
            exit 0
          fi
          gh release create v1.3.7 \
            dist/OlympusView-Android.apk \
            dist/OlympusView-Android.aab \
            dist/OlympusView-Windows.zip \
            dist/OlympusView-Web.zip \
            dist/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title 'Olympus View v1.3.7' \
            --notes-file release-notes.md
